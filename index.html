<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨韵敦煌 · 飞天 — 动态海报 | Ink Rhythm of Dunhuang</title>
  <meta name="description" content="以敦煌飞天为灵感，水墨晕染为底，矿物色点缀。鼠标引导飞天飘带流转，点击绽放莲花，体验传统美学与数字艺术的交融。">
  <meta property="og:title" content="墨韵敦煌 · 飞天 — 动态海报">
  <meta property="og:description" content="敦煌飞天 × 数字生成艺术。水墨、矿物色、莲花曼陀罗，用鼠标互动体验千年的东方美学。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1a1008">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1008;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Noto Serif SC", "SimSun", "KaiTi", serif;
    }
    /* ── 画框容器，移动端自动缩放 ── */
    #container {
      position: relative;
      width: 800px;  height: 800px;
      max-width: 100vw; max-height: 100vh;
      aspect-ratio: 1 / 1;
      border: 2px solid rgba(180,140,80,0.4);
      box-shadow: 0 0 60px rgba(180,120,40,0.25),
                  inset 0 0 60px rgba(0,0,0,0.5);
    }
    /* 小屏自动缩小画框 */
    @media (max-width: 820px) {
      #container {
        width: 100vw; height: auto;
        max-height: 100vw;
      }
    }
    @media (max-height: 820px) {
      #container {
        width: auto; height: 100vh;
        max-width: 100vh;
      }
    }
    /* p5.js canvas 自适应容器 */
    #container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── 底部标题 ── */
    #caption {
      position: absolute;
      bottom: 18px; width: 100%;
      text-align: center;
      color: rgba(210,175,120,0.75);
      pointer-events: none; z-index: 10;
    }
    #caption .title {
      font-size: clamp(13px, 2.2vw, 18px);
      letter-spacing: clamp(2px, 0.5vw, 4px);
      display: block; margin-bottom: 4px;
    }
    #caption .desc {
      font-size: clamp(10px, 1.5vw, 12px);
      opacity: 0.7; line-height: 1.6;
    }

    /* ── 顶部提示 ── */
    #hint {
      position: absolute;
      top: 14px; width: 100%;
      text-align: center;
      color: rgba(210,175,120,0.45);
      font-size: clamp(9px, 1.2vw, 11px);
      letter-spacing: 1px;
      pointer-events: none; z-index: 10;
      transition: opacity 0.8s;
    }

    /* ── 无 JS 提示 ── */
    noscript {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #d2af78; z-index: 999;
      background: #1a1008;
    }
    noscript p { font-size: 16px; letter-spacing: 2px; }
  </style>
</head>
<body>
<div id="container">
  <div id="hint">⟡  移动鼠标 · 点击 · 拖拽  ⟡</div>
  <div id="caption">
    <span class="title">墨 韵 敦 煌 · 飞 天</span>
    <span class="desc">以敦煌飞天为灵感，水墨晕染为底，矿物色点缀。<br>鼠标引导飞天飘带流转，点击绽放莲花，体验传统美学与数字艺术的交融。</span>
  </div>
  <noscript>
    <p>请启用 JavaScript 以观赏动态海报</p>
    <p style="font-size:12px;opacity:0.6;margin-top:8px;">墨韵敦煌 · 飞天</p>
  </noscript>
</div>

<script>
/* ================================================================
 *  墨韵敦煌 · 飞天  —  Ink Rhythm of Dunhuang · Flying Celestial
 *
 *  创作说明：以敦煌飞天为灵感，水墨晕染为底，矿物色点缀。
 *  鼠标引导飞天飘带流转，点击绽放莲花，体验传统美学与数字艺术的交融。
 *
 *  技术要素：setup/draw · HSB色彩 · 矩形/椭圆/线条/弧线
 *           变量动画 · 鼠标位置/点击/拖拽 · translate/rotate/scale
 *           敦煌莫高窟飞天 · 莲花曼陀罗 · 回纹边框 · 矿物颜料色系
 * ================================================================ */

// ==================== 全局变量 ====================
let time           = 0;
let breathPhase    = 0;
let ribbonPhases   = [];
let ribbonCount    = 5;
let dunhuangColors = [];

let mandalaRotation = 0;
let targetRotation  = 0;

let isDragging     = false;
let dragStart;
let dragInfluence  = 0;

let ripples  = [];
let inkDrops = [];


// ==================== 初始化 ====================
function setup() {
  let c = createCanvas(800, 800);
  c.parent('container');

  colorMode(HSB, 360, 100, 100, 1);

  for (let i = 0; i < ribbonCount; i++) {
    ribbonPhases[i] = random(TWO_PI);
  }

  // 敦煌矿物色系 HSB
  dunhuangColors = [
    color(5,   85, 90),   // [0] 朱砂红
    color(200, 80, 70),   // [1] 石青蓝
    color(45,  90, 90),   // [2] 佛金色
    color(30,  10, 25),   // [3] 墨色
    color(35,  40, 80),   // [4] 沙土色
    color(160, 50, 85),   // [5] 松石绿
  ];

  dragStart = createVector(0, 0);
  background(30, 10, 25);

  // 3秒后渐隐顶部提示
  setTimeout(() => {
    let h = document.getElementById('hint');
    if (h) h.style.opacity = '0';
  }, 5000);
}


// ==================== 主循环 ====================
function draw() {
  noStroke();
  fill(30, 10, 25, 0.12);
  rect(0, 0, width, height);

  time        += 0.016;
  breathPhase  = sin(time * 0.5) * 0.15 + 0.85;

  targetRotation = map(mouseX, 0, width, -PI / 6, PI / 6);
  mandalaRotation += (targetRotation - mandalaRotation) * 0.05;

  if (!isDragging && dragInfluence > 0) {
    dragInfluence *= 0.97;
    if (dragInfluence < 0.005) dragInfluence = 0;
  }

  drawInkWashBackground();
  drawFlyingRibbons();

  push();
  translate(width / 2, height / 2);
  drawLotusMandala();
  pop();

  drawBorderDecoration();
  updateAndDrawRipples();
  updateAndDrawInkDrops();
  drawMouseGlow();
}


// ================================================================
// 第 1 层: 水墨晕染背景 — 多层半透明椭圆模拟宣纸渗墨
// ================================================================
function drawInkWashBackground() {
  noStroke();
  for (let i = 0; i < 3; i++) {
    let offX = sin(time * 0.3 + i * TWO_PI / 3) * 60 * breathPhase;
    let offY = cos(time * 0.4 + i * TWO_PI / 3) * 45 * breathPhase;
    let alp  = map(sin(time * 0.6 + i), -1, 1, 0.02, 0.08);
    fill(200 + i * 25, 12, 40 + i * 6, alp);
    ellipse(width / 2 + offX, height / 2 + offY,
            320 + sin(time + i) * 60, 380 + cos(time + i) * 50);
  }
  fill(25, 5, 20, 0.05);
  ellipse(100 + sin(time * 0.2) * 20, 100 + cos(time * 0.3) * 15, 180, 170);
  ellipse(width - 100 + cos(time * 0.25) * 20,
         height - 100 + sin(time * 0.35) * 15, 190, 175);
}


// ================================================================
// 第 2 层: 飞天飘带 — 5条×3层 curveVertex 闭合 Catmull-Rom 样条
// ================================================================
function drawFlyingRibbons() {
  noFill();
  for (let r = 0; r < ribbonCount; r++) {
    let basePhase     = ribbonPhases[r] + time * (0.7 + r * 0.12);
    let mouseDist     = dist(mouseX, mouseY, width / 2, height / 2);
    let mouseInfluence = constrain(mouseDist / (width * 0.45), 0, 1);
    let activity      = 1 + dragInfluence * 2.5;
    let baseColor     = dunhuangColors[r % dunhuangColors.length];

    let ptCount = 150;
    let xs = new Array(ptCount);
    let ys = new Array(ptCount);

    for (let i = 0; i < ptCount; i++) {
      let t      = map(i, 0, ptCount, 0, TWO_PI);
      let radius  = 170 + r * 38;
      radius     += sin(t * 3 + basePhase) * 65 * activity;
      radius     += sin(t * 5 + basePhase * 1.4) * 28;
      radius     += cos(t * 7 + basePhase * 0.7) * 15 * mouseInfluence;

      let pullX = (mouseX - width / 2) * 0.18 * sin(t + basePhase);
      let pullY = (mouseY - height / 2) * 0.18 * cos(t + basePhase);
      xs[i] = cos(t + basePhase * 0.25) * radius + pullX;
      ys[i] = sin(t + basePhase * 0.25) * radius + pullY;
    }

    for (let layer = 0; layer < 3; layer++) {
      let layerAlpha = map(layer, 0, 2, 0.55, 0.18);
      let layerWidth = map(layer, 0, 2, 3.5, 0.8) * breathPhase * activity;
      strokeWeight(layerWidth);

      let ribbonHue = (hue(baseColor) + time * 15 + r * 40) % 360;
      stroke(ribbonHue,
             saturation(baseColor) * (0.7 + layer * 0.15),
             brightness(baseColor) * (0.6 + layer * 0.2),
             layerAlpha);

      beginShape();
      curveVertex(xs[ptCount - 2] + width / 2, ys[ptCount - 2] + height / 2);
      for (let i = 0; i < ptCount; i++) {
        curveVertex(xs[i] + width / 2, ys[i] + height / 2);
      }
      curveVertex(xs[0] + width / 2, ys[0] + height / 2);
      curveVertex(xs[1] + width / 2, ys[1] + height / 2);
      endShape();
    }
  }
}


// ================================================================
// 第 3 层: 莲花曼陀罗 — translate + rotate + scale 三重变换
// ================================================================
function drawLotusMandala() {
  scale(breathPhase * (1 + dragInfluence * 0.25));
  rotate(mandalaRotation);

  let petalCount = 8;

  // --- 外层: 八瓣莲花 (椭圆旋转阵列, 朱砂↔佛金渐变) ---
  for (let i = 0; i < petalCount; i++) {
    let angle = i * TWO_PI / petalCount;
    push();
    rotate(angle);
    translate(0, -80);

    let petalHue = lerpColor(
      dunhuangColors[0], dunhuangColors[2],
      map(sin(time + i * 1.2), -1, 1, 0, 1)
    );
    let petalSat = 75 + sin(time * 1.5 + i) * 15;
    let petalBri = 68 + cos(time * 2 + i) * 18;

    for (let g = 0; g < 5; g++) {
      fill(hue(petalHue), petalSat, petalBri + g * 4, map(g, 0, 4, 0.75, 0.15));
      noStroke();
      ellipse(0, 0, 26 - g * 3.5, 58 - g * 6);
    }
    pop();
  }

  // --- 中层: 三圈虚线装饰环 (石青色, 不同转速) ---
  noFill();
  for (let ring = 0; ring < 3; ring++) {
    let ringR   = 47 + ring * 18;
    let ringHue = (hue(dunhuangColors[1]) + ring * 25 + time * 6) % 360;
    strokeWeight(1.6 - ring * 0.35);
    stroke(ringHue, 55, 82, 0.65 - ring * 0.18);

    let dashLen  = 0.14 + ring * 0.04;
    let rotSpeed = time * 0.4 * (ring + 1);
    for (let a = 0; a < TWO_PI; a += dashLen * 2) {
      arc(0, 0, ringR * 2, ringR * 2, a + rotSpeed, a + rotSpeed + dashLen);
    }
  }

  // --- 内层: 12 颗金色莲心小圆点 + 中心光点 ---
  let innerR = 18;
  for (let i = 0; i < 12; i++) {
    let a = i * TWO_PI / 12 + time * 0.25;
    fill(45, 85, 92, 0.78); noStroke();
    ellipse(cos(a) * innerR, sin(a) * innerR, 6.5, 6.5);
  }
  fill(45, 80, 98); noStroke();
  ellipse(0, 0, 10 * breathPhase, 10 * breathPhase);
}


// ================================================================
// 第 4 层: 边框装饰 — 双层矩框 + 四角回纹
// ================================================================
function drawBorderDecoration() {
  noFill();
  let brdA = 0.28 + sin(time) * 0.10;

  // 外框 (石青)
  stroke(198, 55, 72, brdA); strokeWeight(2.2);
  rect(18, 18, width - 36, height - 36);

  // 内框 (沙土)
  stroke(32, 28, 72, brdA * 0.65); strokeWeight(1);
  rect(28, 28, width - 56, height - 56);

  // 四角回纹 (3 层叠进小矩形)
  let crA = 0.22 + sin(time * 1.5) * 0.08;
  for (let c = 0; c < 4; c++) {
    let cx   = (c % 2 === 0) ? 32 : width - 32;
    let cy   = (c < 2) ? 32 : height - 32;
    let dirX = (c % 2 === 0) ? 1 : -1;
    let dirY = (c < 2) ? 1 : -1;
    stroke(44, 65, 82, crA); strokeWeight(1.5);
    for (let j = 0; j < 3; j++) {
      rect(cx + dirX * j * 11, cy + dirY * j * 11, 7, 7);
    }
  }
}


// ================================================================
// 第 5 层: 涟漪 — 点击产生，双层同心圆扩散渐隐
// ================================================================
class Ripple {
  constructor(px, py) {
    this.x = px; this.y = py;
    this.radius = 0; this.maxRadius = 160;
    this.alphaVal = 0.55;
    this.hueVal = (hue(dunhuangColors[2]) + random(-20, 20)) % 360;
  }
  update()  { this.radius += 2.8; this.alphaVal -= 0.0075; }
  isDead()  { return this.alphaVal <= 0 || this.radius > this.maxRadius; }
  draw() {
    noFill();
    strokeWeight(2.2 - this.radius / this.maxRadius * 1.6);
    stroke(this.hueVal, 45, 88, this.alphaVal);
    ellipse(this.x, this.y, this.radius * 2, this.radius * 2);
    if (this.radius > 15) {
      strokeWeight(0.6);
      stroke(this.hueVal, 28, 92, this.alphaVal * 0.45);
      ellipse(this.x, this.y, this.radius * 1.45, this.radius * 1.45);
    }
  }
}
function updateAndDrawRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].draw();
    if (ripples[i].isDead()) ripples.splice(i, 1);
  }
}


// ================================================================
// 第 6 层: 墨滴粒子 — 拖拽/点击产生，受重力下落，模拟毛笔飞溅
// ================================================================
class InkDrop {
  constructor(px, py, pvx, pvy) {
    this.x = px; this.y = py;
    this.vx = pvx; this.vy = pvy;
    this.size = random(3, 14);
    this.alphaVal = random(0.25, 0.65);
    this.hueVal = random(22, 38);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.08; this.alphaVal -= 0.0045;
    this.size *= 1.003;
  }
  isDead() {
    return this.alphaVal <= 0 || this.x < -20 || this.x > width + 20
        || this.y < -20 || this.y > height + 20;
  }
  draw() {
    noStroke();
    fill(this.hueVal, 6, 32, this.alphaVal);
    ellipse(this.x, this.y, this.size, this.size * 0.65);
  }
}
function updateAndDrawInkDrops() {
  for (let i = inkDrops.length - 1; i >= 0; i--) {
    inkDrops[i].update(); inkDrops[i].draw();
    if (inkDrops[i].isDead()) inkDrops.splice(i, 1);
  }
}


// ================================================================
// 第 7 层: 鼠标光晕 — 佛光式三层光环跟随光标
// ================================================================
function drawMouseGlow() {
  let glowR = 14 + sin(time * 3) * 5;
  let glowA = 0.20 + sin(time * 2.5) * 0.07;
  noStroke();
  for (let i = 3; i > 0; i--) {
    fill(44, 55, 92, glowA / (i + 0.8));
    ellipse(mouseX, mouseY, (glowR + i * 7) * 2, (glowR + i * 7) * 2);
  }
  fill(44, 30, 98, glowA * 1.2);
  ellipse(mouseX, mouseY, glowR * 0.7, glowR * 0.7);
}


// ================================================================
// 鼠标 / 触屏事件
// ================================================================
function mousePressed() {
  ripples.push(new Ripple(mouseX, mouseY));
  for (let i = 0; i < 6; i++) {
    let a = random(TWO_PI), s = random(0.6, 3.5);
    inkDrops.push(new InkDrop(mouseX, mouseY, cos(a) * s, sin(a) * s));
  }
  dragStart.set(mouseX, mouseY);
  isDragging = true;
  return false;
}

function mouseDragged() {
  if (!isDragging) return;
  let spd = dist(mouseX, mouseY, pmouseX, pmouseY);
  let count = int(spd / 4) + 1;
  for (let i = 0; i < count; i++) {
    let t = i / count;
    inkDrops.push(new InkDrop(
      lerp(pmouseX, mouseX, t), lerp(pmouseY, mouseY, t),
      random(-0.4, 0.4), random(-0.4, 0.4)));
  }
  dragInfluence = constrain(dragInfluence + 0.018, 0, 1);
  return false;
}

function mouseReleased() {
  isDragging = false;
  ripples.push(new Ripple(mouseX, mouseY));
  for (let i = 0; i < 10; i++) {
    let a = random(TWO_PI), s = random(1, 4.5);
    inkDrops.push(new InkDrop(mouseX, mouseY, cos(a) * s, sin(a) * s));
  }
  return false;
}

function touchStarted() { mousePressed();  return false; }
function touchMoved()   { mouseDragged();  return false; }
function touchEnded()   { mouseReleased(); return false; }

// 窗口大小变化时暂不做 resize，保持 800×800 设计精度
// CSS 负责将 canvas 缩放适配容器
function windowResized() {}
</script>
</body>
</html>
